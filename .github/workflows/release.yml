name: Release

# Builds "Simple Sync S3.app" (universal, ad hoc signed) and the s5-sync command-line tool,
# then publishes a GitHub release whose notes come from the matching CHANGELOG.md section.
# Trigger: push a tag "vX.Y.Z", or run this workflow by hand with the version (the tag is created).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the "v" (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1
          fi
          cat release-notes.md

      - name: Test
        run: swift test

      - name: Build the app (universal)
        env:
          S5_UNIVERSAL: '1'
          S5_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-app.sh

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          APP_ZIP="SimpleSyncS3-$VERSION-macOS.zip"
          CLI_ZIP="s5-sync-$VERSION-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/Simple Sync S3.app" "dist/$APP_ZIP"
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          mkdir -p cli && cp "$BIN_DIR/s5-sync" cli/ && codesign --force --sign - cli/s5-sync
          ditto -c -k cli/ "dist/$CLI_ZIP"
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          lipo -info "build/Simple Sync S3.app/Contents/MacOS/SimpleSyncS3"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Simple Sync S3 $VERSION" \
            --notes-file release-notes.md
