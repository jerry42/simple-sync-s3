<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Simple Sync S3 app icon: a cloud with two sync arrows.
       Source of AppIcon.icns: regenerate with ./scripts/make-icon.sh -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#40AAF5"/>
      <stop offset="1" stop-color="#1452B8"/>
    </linearGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="740">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B2E6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 rounded square centred in 1024x1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- cloud -->
  <g fill="url(#cloud)" filter="url(#soft)">
    <circle cx="410" cy="540" r="125"/>
    <circle cx="580" cy="500" r="165"/>
    <circle cx="300" cy="640" r="95"/>
    <circle cx="724" cy="640" r="95"/>
    <rect x="300" y="545" width="424" height="190" rx="95"/>
  </g>
  <!-- sync arrows -->
  <g fill="none" stroke="#1E6FD9" stroke-width="38" stroke-linecap="round">
    <path d="M 425.5 616.5 A 92 92 0 0 1 537.4 496.6"/>
    <path d="M 598.5 553.5 A 92 92 0 0 1 486.6 673.4"/>
  </g>
  <g fill="#1E6FD9" stroke="#1E6FD9" stroke-width="8" stroke-linejoin="round">
    <path d="M 582.1 509.4 L 535.1 448.1 L 509.8 536.5 Z"/>
    <path d="M 441.9 660.6 L 488.9 721.9 L 514.2 633.5 Z"/>
  </g>
</svg>
